api:
  enabled: true
  address: 0.0.0.0:9001

# NOTE: This is a TEMPLATE file. The placeholders below are replaced
# when a new project is created by supabase_setup.py / bash/create_new_supabase.sh:
#   __PROJECT__            -> <project_name>
#   __ANALYTICS_SERVICE__  -> <project_name>-analytics
#   __KONG_SERVICE__       -> <project_name>-kong  (kept for back-compat with older scripts)
# When the master docker stack runs in the project root (no template substitution),
# the literal "supabase-*" container names match the master docker-compose.yml.

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - __PROJECT__-vector # Exclude vector logs from being ingested by itself
    include_containers:
      - "__PROJECT__-*" # Only include containers from this project

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "__PROJECT__"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_created_at)
      del(.container_id)
      del(.source_type)
      del(.stream)
      del(.label)
      del(.image)
      del(.host)
      del(.stream)
  router:
    type: route
    inputs:
      - project_logs
    route:
      # In master, the API gateway is `envoy` by default and `kong` when the
      # kong override is enabled. The realtime container name has a
      # `realtime-dev.` prefix, which we match explicitly.
      kong: '.appname == "__PROJECT__-kong" || .appname == "__PROJECT__-envoy"'
      auth: '.appname == "__PROJECT__-auth"'
      rest: '.appname == "__PROJECT__-rest"'
      realtime: '.appname == "realtime-dev.__PROJECT__-realtime"'
      storage: '.appname == "__PROJECT__-storage"'
      functions: '.appname == "__PROJECT__-edge-functions"'
      db: '.appname == "__PROJECT__-db"'
  # Ignores non nginx errors since they are related with kong booting up
  kong_logs:
    type: remap
    inputs:
      - router.kong
    source: |-
      req, err = parse_nginx_log(.event_message, "combined")
      if err == null {
          .timestamp = req.timestamp
          .metadata.request.headers.referer = req.referer
          .metadata.request.headers.user_agent = req.agent
          .metadata.request.headers.cf_connecting_ip = req.client
          .metadata.response.status_code = req.status
          url, split_err = split(req.request, " ")
          if split_err == null {
              .metadata.request.method = url[0]
              .metadata.request.path = url[1]
              .metadata.request.protocol = url[2]
          }
      }
      if err != null {
        abort
      }
  # Ignores non nginx errors since they are related with kong booting up
  kong_err:
    type: remap
    inputs:
      - router.kong
    source: |-
      .metadata.request.method = "GET"
      .metadata.response.status_code = 200
      parsed, err = parse_nginx_log(.event_message, "error")
      if err == null {
          .timestamp = parsed.timestamp
          .severity = parsed.severity
          .metadata.request.host = parsed.host
          .metadata.request.headers.cf_connecting_ip = parsed.client
          url, err = split(parsed.request, " ")
          if err == null {
              .metadata.request.method = url[0]
              .metadata.request.path = url[1]
              .metadata.request.protocol = url[2]
          }
      }
      if err != null {
        abort
      }
  # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
  auth_logs:
    type: remap
    inputs:
      - router.auth
    source: |-
      parsed, err = parse_json(.event_message)
      if err == null {
          .metadata.timestamp = parsed.time
          .metadata = merge!(.metadata, parsed)
      }
  # PostgREST logs are structured so we separate timestamp from message using regex
  rest_logs:
    type: remap
    inputs:
      - router.rest
    source: |-
      parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .timestamp = parse_timestamp!(value: parsed.time,format: "%d/%b/%Y:%H:%M:%S %z")
          .metadata.host = .project
      }
  # Filter out healthcheck logs from Realtime
  realtime_logs_filtered:
    type: filter
    inputs:
      - router.realtime
    condition: '!contains(string!(.event_message), "/health")'
  # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
  realtime_logs:
    type: remap
    inputs:
      - realtime_logs_filtered
    source: |-
      .metadata.project = del(.project)
      .metadata.external_id = .metadata.project
      parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
      }
  # Function logs are unstructured messages on stderr
  functions_logs:
    type: remap
    inputs:
      - router.functions
    source: |-
      .metadata.project_ref = del(.project)
  # Storage logs may contain json objects so we parse them for completeness
  storage_logs:
    type: remap
    inputs:
      - router.storage
    source: |-
      .metadata.project = del(.project)
      .metadata.tenantId = .metadata.project
      parsed, err = parse_json(.event_message)
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
          .metadata.timestamp = parsed.time
          .metadata.context[0].host = parsed.hostname
          .metadata.context[0].pid = parsed.pid
      }
  # Postgres logs some messages to stderr which we map to warning severity level
  db_logs:
    type: remap
    inputs:
      - router.db
    source: |-
      .metadata.host = "db-__PROJECT__"
      .metadata.parsed.timestamp = .timestamp

      parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

      if err != null || parsed == null {
        .metadata.parsed.error_severity = "info"
      }
      if parsed.level != null {
       .metadata.parsed.error_severity = parsed.level
      }
      if .metadata.parsed.error_severity == "info" {
          .metadata.parsed.error_severity = "log"
      }
      .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)

sinks:
  console_sink:
    type: console
    inputs:
      - project_logs
    encoding:
      codec: json
    target: stdout

  default_logs:
    type: console
    inputs:
      - router._unmatched
    encoding:
      codec: json
    target: stdout

  # Legacy local analytics sink used by older logflare versions (LOGFLARE_API_KEY
  # is a project-level API key). Newer logflare (1.43.1) splits access into
  # LOGFLARE_PUBLIC_ACCESS_TOKEN / LOGFLARE_PRIVATE_ACCESS_TOKEN and is wired up
  # by volumes/logs/vector.yml (generated per project). We keep the legacy sink
  # here so older installations keep working.
  logflare_auth:
    type: "http"
    inputs:
      - auth_logs
    encoding:
      codec: "json"
    method: "post"
    request:
      retry_max_duration_secs: 10
    uri: "http://__ANALYTICS_SERVICE__:4000/api/logs?source_name=gotrue.logs.prod&api_key=${LOGFLARE_API_KEY:-dummy_key_for_validation}"
  logflare_realtime:
    type: "http"
    inputs:
      - realtime_logs
    encoding:
      codec: "json"
    method: "post"
    request:
      retry_max_duration_secs: 10
    uri: "http://__ANALYTICS_SERVICE__:4000/api/logs?source_name=realtime.logs.prod&api_key=${LOGFLARE_API_KEY:-dummy_key_for_validation}"
  logflare_rest:
    type: "http"
    inputs:
      - rest_logs
    encoding:
      codec: "json"
    method: "post"
    request:
      retry_max_duration_secs: 10
    uri: "http://__ANALYTICS_SERVICE__:4000/api/logs?source_name=postgREST.logs.prod&api_key=${LOGFLARE_API_KEY:-dummy_key_for_validation}"
  logflare_db:
    type: "http"
    inputs:
      - db_logs
    encoding:
      codec: "json"
    method: "post"
    request:
      retry_max_duration_secs: 10
    uri: "http://__KONG_SERVICE__:8000/analytics/v1/api/logs?source_name=postgres.logs&api_key=${LOGFLARE_API_KEY:-dummy_key_for_validation}"
  logflare_functions:
    type: "http"
    inputs:
      - router.functions
    encoding:
      codec: "json"
    method: "post"
    request:
      retry_max_duration_secs: 10
    uri: "http://__ANALYTICS_SERVICE__:4000/api/logs?source_name=deno-relay-logs&api_key=${LOGFLARE_API_KEY:-dummy_key_for_validation}"
  logflare_storage:
    type: "http"
    inputs:
      - storage_logs
    encoding:
      codec: "json"
    method: "post"
    request:
      retry_max_duration_secs: 10
    uri: "http://__ANALYTICS_SERVICE__:4000/api/logs?source_name=storage.logs.prod.2&api_key=${LOGFLARE_API_KEY:-dummy_key_for_validation}"
  logflare_kong:
    type: "http"
    inputs:
      - kong_logs
      - kong_err
    encoding:
      codec: "json"
    method: "post"
    request:
      retry_max_duration_secs: 10
    uri: "http://__ANALYTICS_SERVICE__:4000/api/logs?source_name=cloudflare.logs.prod&api_key=${LOGFLARE_API_KEY:-dummy_key_for_validation}"
